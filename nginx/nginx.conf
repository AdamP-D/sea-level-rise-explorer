server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # ── Static frontend ───────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ── US Census Geocoder ────────────────────────────────────────────────────
    # JS:    /api/census/geocoder/geographies/onelineaddress?...
    # Upstream: https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?...
    location /api/census/ {
        proxy_pass https://geocoding.geo.census.gov/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host geocoding.geo.census.gov;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
    }

    # ── Census TIGER boundary service ─────────────────────────────────────────
    # JS:    /api/tiger/arcgis/rest/services/TIGERweb/.../query?...
    # Upstream: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/.../query?...
    location /api/tiger/ {
        proxy_pass https://tigerweb.geo.census.gov/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host tigerweb.geo.census.gov;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_read_timeout 30s;
    }

    # ── FEMA National Risk Index API ──────────────────────────────────────────
    # JS:    /api/nri/api/counties/{fips5} or /api/nri/api/tracts/{fips11}
    # Upstream: https://hazards.fema.gov/nri/api/counties/{fips5}
    location /api/nri/ {
        proxy_pass https://hazards.fema.gov/nri/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host hazards.fema.gov;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
    }

    # ── OSM Overpass API (POST requests for building footprints) ─────────────
    # JS:    POST /api/overpass/api/interpreter
    # Upstream: POST https://overpass-api.de/api/interpreter
    location /api/overpass/ {
        proxy_pass https://overpass-api.de/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host overpass-api.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
    }
}
