server {
    listen 80;
    server_name _;

    # ── Static frontend ───────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ── US Census Geocoder ────────────────────────────────────────────────────
    # JS:       /api/census/geocoder/geographies/onelineaddress?...
    # Upstream: https://geocoding.geo.census.gov/geocoder/...
    location /api/census/ {
        proxy_pass https://geocoding.geo.census.gov/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host geocoding.geo.census.gov;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
    }

    # ── FEMA National Risk Index — Census Tracts feature service ─────────────
    # JS:       /api/nri-tracts/0/query?where=TRACTFIPS='...'&...
    # Upstream: https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/
    #           National_Risk_Index_Census_Tracts/FeatureServer/0/query?...
    #
    # services.arcgis.com is CDN-backed: resolve per-request via Docker's DNS
    # (variable proxy_pass) and skip AAAA records — Docker containers usually
    # have no IPv6 route, which otherwise causes 502s.
    location /api/nri-tracts/ {
        resolver 127.0.0.11 ipv6=off valid=60s;
        set $arcgis services.arcgis.com;
        rewrite ^/api/nri-tracts/(.*)$ /XG15cJAlne2vxtgt/arcgis/rest/services/National_Risk_Index_Census_Tracts/FeatureServer/$1 break;
        proxy_pass https://$arcgis;
        proxy_ssl_server_name on;
        proxy_ssl_name services.arcgis.com;
        proxy_ssl_verify off;
        proxy_set_header Host services.arcgis.com;
        proxy_set_header Accept-Encoding "";
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_read_timeout 30s;
    }

    # ── FEMA National Risk Index — Counties feature service (fallback) ───────
    # JS:       /api/nri-counties/0/query?where=STCOFIPS='...'&...
    location /api/nri-counties/ {
        resolver 127.0.0.11 ipv6=off valid=60s;
        set $arcgis services.arcgis.com;
        rewrite ^/api/nri-counties/(.*)$ /XG15cJAlne2vxtgt/arcgis/rest/services/National_Risk_Index_Counties/FeatureServer/$1 break;
        proxy_pass https://$arcgis;
        proxy_ssl_server_name on;
        proxy_ssl_name services.arcgis.com;
        proxy_ssl_verify off;
        proxy_set_header Host services.arcgis.com;
        proxy_set_header Accept-Encoding "";
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_read_timeout 30s;
    }

    # ── Census TIGERweb — tract boundary fallback ─────────────────────────────
    # JS:       /api/tiger/arcgis/rest/services/TIGERweb/Tracts_Blocks/MapServer/0/query?...
    # Upstream: https://tigerweb.geo.census.gov/arcgis/rest/services/...
    location /api/tiger/ {
        proxy_pass https://tigerweb.geo.census.gov/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host tigerweb.geo.census.gov;
        proxy_set_header Accept-Encoding "";
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_read_timeout 30s;
    }

    # ── NOAA Sea Level Rise map services (fallback; browser goes direct first) ─
    # JS:       /api/noaa-slr/slr_3ft/MapServer/0/query?... (and /tile/{z}/{y}/{x})
    # Upstream: https://www.coast.noaa.gov/arcgis/rest/services/dc_slr/...
    location /api/noaa-slr/ {
        proxy_pass https://www.coast.noaa.gov/arcgis/rest/services/dc_slr/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host www.coast.noaa.gov;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
    }

    # ── Photon geocoder (address autocomplete fallback) ───────────────────────
    # JS:       /api/photon/api/?q=...
    # Upstream: https://photon.komoot.io/api/?q=...
    location /api/photon/ {
        proxy_pass https://photon.komoot.io/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host photon.komoot.io;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 15s;
    }

    # ── OSM Overpass API (POST, building footprints) ──────────────────────────
    # JS:       POST /api/overpass/api/interpreter
    # Upstream: POST https://overpass-api.de/api/interpreter
    location /api/overpass/ {
        proxy_pass https://overpass-api.de/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host overpass-api.de;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
    }
}
